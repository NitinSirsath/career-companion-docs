name: Product site docs once (temporary)
# Commits the reviewed change on docs/product-site and nothing else.
# Lives only on the throwaway branch tmp/site-docs, which is deleted afterwards.
on:
  push:
    branches: [tmp/site-docs]
permissions:
  contents: write
concurrency:
  group: site-docs-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/product-site
      - name: Check the branch
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "6071a4d8b1cc0ce6c1579de5e7c413712a18ed72" ]; then
            echo "docs/product-site is not at the expected commit. Nothing was changed."
            exit 1
          fi
      - name: Apply the reviewed change
        run: |
          cat > /tmp/change.diff <<'PATCH'
          diff --git a/docs/architecture/mvp-architecture.md b/docs/architecture/mvp-architecture.md
          index eb46c04..fbe886f 100644
          --- a/docs/architecture/mvp-architecture.md
          +++ b/docs/architecture/mvp-architecture.md
          @@ -10 +10,2 @@ This document describes the Sprint 4.5 MVP with the 2026-09-26 stabilization cor
          -- **Two sites (owner, 2026-10-31):** `https://northlist.site` is the product site: one public page (what NorthList does, why it asks for each Gmail permission, the privacy policy), plus `privacy.html`. It is static: no router, no server calls, no service worker. `https://app.northlist.site` is the app. The product page's "Sign in" buttons are plain links to `https://app.northlist.site/login`; the product page does not know whether the visitor is signed in, and a signed-in user on `/login` goes on to the Dashboard. In the app, `/` goes to `/dashboard` when signed in and to `/login` when not; every other app page needs sign-in and sends a visitor to `/login` with the page as `next`. App addresses on `northlist.site` (such as `/mails`) do not exist; there are no redirects. Google's OAuth branding names `https://northlist.site` as the home page and `https://northlist.site/privacy.html` as the privacy policy, so both must stay public. How it is hosted: two Render static sites built from the frontend repository. The app site runs `npm run build` and publishes `dist`, with rewrites `/api/*` to the backend and everything else to `index.html`. The product site runs `npm run build:site` (`vite.site.config.ts`, page in `site/`) and publishes `dist-site`, with no rewrites, so any other address there gets the product site's own "page not found" page, `site/public/404.html` (Render serves `/404.html` for unknown addresses; a catch-all rewrite would hide it). The product site's `site/public/sw.js` only removes the app's old service worker from browsers that opened northlist.site before the split; the product site never registers a service worker itself. The backend settings `FRONTEND_URL`, `GOOGLE_REDIRECT_URI` and `GMAIL_REDIRECT_URI` name `https://app.northlist.site`.
          +- **Two sites (owner, 2026-10-31):** `https://northlist.site` is the product site: five public pages (see the next entry), plus `privacy.html`. It is static: no router, no server calls, no service worker. `https://app.northlist.site` is the app. The product site's "Sign in" and "Start free" buttons are plain links to `https://app.northlist.site/login`; the product site does not know whether the visitor is signed in, and a signed-in user on `/login` goes on to the Dashboard. In the app, `/` goes to `/dashboard` when signed in and to `/login` when not; every other app page needs sign-in and sends a visitor to `/login` with the page as `next`. App addresses on `northlist.site` (such as `/mails`) do not exist; there are no redirects. Google's OAuth branding names `https://northlist.site` as the home page and `https://northlist.site/privacy.html` as the privacy policy, so both must stay public. How it is hosted: two Render static sites built from the frontend repository. The app site runs `npm run build` and publishes `dist`, with rewrites `/api/*` to the backend and everything else to `index.html`. The product site runs `npm run build:site` (`vite.site.config.ts`, pages in `site/`) and publishes `dist-site`, with no rewrites, so any other address there gets the product site's own "page not found" page, `site/public/404.html` (Render serves `/404.html` for unknown addresses; a catch-all rewrite would hide it). The product site's `site/public/sw.js` only removes the app's old service worker from browsers that opened northlist.site before the split; the product site never registers a service worker itself. The backend settings `FRONTEND_URL`, `GOOGLE_REDIRECT_URI` and `GMAIL_REDIRECT_URI` name `https://app.northlist.site`.
          +- **Product site pages (owner, 2026-11-01):** the product site has five pages: Home `/`, Pricing `/pricing`, Privacy `/privacy` (everything about data in plain words; the legal policy stays `/privacy.html`), Changelog `/changelog` and About `/about`. Each is a plain HTML page in `site/` (`site/index.html`, `site/pricing/index.html` and so on) with its words in its HTML: the build fills in the shared parts (header, footer, data promises, changelog entries, icons) from `site/parts/`, and Render serves `pricing/index.html` at `/pricing`. In the browser, small TypeScript modules add the theme switch (light by default), the phone menu, the motion and Home's pictures: a live example of the app with made-up mails (`site/example/`), phone pictures (an iPhone 18, or a Pixel 11 Pro for Android visitors) and pictures that play once, each with a replay button (with reduced motion they show their end state). No React and no server calls; the theme choice is the only thing kept in the browser. **Data rule:** every data sentence on the site matches `privacy.html`; the site never says NorthList stores nothing; when `privacy.html` changes, the Privacy page and the data promises (`site/parts/data.ts`) change in the same PR. **Changelog rule:** each release that users can see adds an entry at the top of `site/parts/changelog.ts`, newest first.
          PATCH
          git apply --unidiff-zero /tmp/change.diff
          git add -A
          if [ "$(git write-tree)" != "44be7b9b8d874220b7ac6b36c6b08722b65a521c" ]; then
            echo "The result does not match the reviewed files. Nothing was pushed."
            git status --short
            exit 1
          fi
      - name: Commit only the reviewed result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(architecture): docs/architecture/mvp-architecture.md'
          git push origin HEAD:docs/product-site
